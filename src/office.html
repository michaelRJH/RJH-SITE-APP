  <!-- OFFICE: every site's sheets, from the register in RJH-Site -->
  <section id="panel-office" data-title="Office" hidden>
    <p class="note" id="of-note">Every sheet filed from every site. Tap a status to move it on. Open brings the sheet into this app so you can read it, print it or download the quantities.</p>
    <div class="of-bar">
      <div class="seg four" id="of-view"><button type="button" data-v="toprice" aria-pressed="true">To price</button><button type="button" data-v="new" aria-pressed="false">New</button><button type="button" data-v="all" aria-pressed="false">All</button><button type="button" data-v="mine" aria-pressed="false">Mine</button></div>
      <div class="grid2" style="margin-top:8px">
        <div class="field"><label for="of-site">Site</label><div class="in"><select id="of-site" class="of-sel"><option value="">All sites</option></select></div></div>
        <div class="field"><label for="of-type">Type</label><div class="in"><select id="of-type" class="of-sel"><option value="">All types</option></select></div></div>
      </div>
      <div class="btnrow" style="margin-top:0"><button class="btn" type="button" id="of-refresh">Refresh</button><button class="btn" type="button" id="of-csv">Download list (CSV)</button></div>
    </div>
    <div class="stat"><div class="box"><small>To price</small><b id="of-n-toprice">–</b></div><div class="box"><small>Over 14 days</small><b id="of-n-old">–</b></div><div class="box"><small>This month</small><b id="of-n-month">–</b></div></div>
    <div id="of-list"><p class="note">Sign in on the home screen first.</p></div>
  </section>
